<!DOCTYPE html>

<html>

<head>
	<link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,menu,close"
    />
	<link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex align-items-center justify-content-center">
    <div class="m-2">
      <h1 class="text-center">Login Form</h1>
      <form>
        <div class="m-2">
          <input
            class="form-control"
            type="text"
            placeholder="Username"
            id="username"
            required
          />
        </div>
        <div class="m-2">
          <input
            id="password"
            type="password"
            placeholder="Password"
            class="form-control"
            required
          />
        </div>
        <div class="m-2">
          <label for="checkbox" class="form-label">Remember me.</label>
          <input type="checkbox" id="checkbox" />
        </div>
        <div>
          <button
            type="submit"
            id="existing"
            value="Submit"
            class="btn btn-primary d-none"
          >
            Login as existing user
          </button>
          <button
            type="submit"
            id="submit"
            value="Submit"
            class="btn btn-primary"
          >
            submit
          </button>
        </div>
      </form>
    </div>
  </body>
    <script type="text/javascript" src="./script.js"></script>

</html>
